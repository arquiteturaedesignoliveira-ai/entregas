var CHAVE = "oad-senha-raquel-alan";
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function abre(senha) {
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  var chave = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.sal), iterations: P.it, hash: "SHA-256"},
                                             base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  var bytes = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, chave, b64(P.dados));
  var html = new TextDecoder().decode(bytes);
  try { localStorage.setItem(CHAVE, senha); } catch (x) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var s = document.getElementById("s").value.trim().toUpperCase();
  document.getElementById("e").textContent = "";
  abre(s).catch(function () { document.getElementById("e").textContent = "Senha incorreta. Confira e tente de novo."; });
});
try { var g = localStorage.getItem(CHAVE); if (g) abre(g).catch(function () { try { localStorage.removeItem(CHAVE); } catch (x) {} }); } catch (x) {}
