<style>
:root{--bg:#F3F2EF;--txt:#2E2C2A;--dim:#7A766F;--linha:#DDD9D3;--cor:#985041;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:Sora,"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding-inline:16px}
form{width:100%;max-width:320px;display:grid;gap:10px}
.marca{margin:0;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--dim)}
h1{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
input{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--linha);border-radius:0;background:#fff;color:var(--txt)}
input:focus{outline:1px solid var(--txt)}
button{font:inherit;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:11px;border:0;border-radius:0;background:var(--cor);color:#fff;cursor:pointer}
.erro{min-height:14px;margin:0;font-size:11px;color:var(--cor)}
</style>

var CHAVE = "oad-senha-raquel-alan";
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function abre(senha) {
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  var chave = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.sal), iterations: P.it, hash: "SHA-256"},
                                             base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  var bytes = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, chave, b64(P.dados));
  var html = new TextDecoder().decode(bytes);
  try { localStorage.setItem(CHAVE, senha); } catch (x) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var s = document.getElementById("s").value.trim().toUpperCase();
  document.getElementById("e").textContent = "";
  abre(s).catch(function () { document.getElementById("e").textContent = "Senha incorreta. Confira e tente de novo."; });
});
try { var g = localStorage.getItem(CHAVE); if (g) abre(g).catch(function () { try { localStorage.removeItem(CHAVE); } catch (x) {} }); } catch (x) {}
